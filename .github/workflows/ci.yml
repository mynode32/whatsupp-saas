name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        # No secrets configured here on purpose — the app runs in demo
        # mode with zero env vars (see lib/env.ts / lib/env.server.ts),
        # so the build must succeed without any Supabase/Twilio keys.
        run: npm run build
